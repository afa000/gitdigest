plugins {
    id 'application'
}

group = 'dev.gitdigest'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    // JGit logs through SLF4J. Without a binding it prints a startup warning
    // to stderr on every run; the no-op binding keeps the CLI output clean.
    runtimeOnly 'org.slf4j:slf4j-nop:1.7.36'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // Pins the JDK for every build, so the version does not depend on
    // whatever JAVA_HOME happens to be set to on this machine or on CI.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.gitdigest.GitDigest'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}
