plugins {
    id 'application'
}

group = 'dev.gitdigest'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.anthropic:anthropic-java:2.34.0'

    // JGit and the Anthropic SDK both log through SLF4J. Without a binding
    // they print a startup warning to stderr on every run; the no-op binding
    // keeps the CLI output clean. Pinned to 2.x to match the slf4j-api the
    // Anthropic SDK brings in - a 1.7.x binding is ignored by a 2.x api and
    // the warning comes back, louder.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // Pins the JDK for every build, so the version does not depend on
    // whatever JAVA_HOME happens to be set to on this machine or on CI.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.gitdigest.GitDigest'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform {
        // The benchmark is a report, not a check: it is slow by design and its
        // result is a number rather than a pass. Keeping it out of `test` keeps
        // the build fast and keeps a loaded CI machine from failing it.
        excludeTags 'benchmark'
    }
}

tasks.register('benchmark', Test) {
    description = 'Measures parallel GitHub enrichment against a slow local server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // Always rerun: a cached timing measurement is not a measurement.
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}
