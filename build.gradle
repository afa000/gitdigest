plugins {
    id 'application'
    // The maintained fork; the old com.github.johnrengelman.shadow is
    // unmaintained and does not work on Gradle 9.
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'dev.gitdigest'
version = '0.1.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.10.0.202406032230-r'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'com.anthropic:anthropic-java:2.34.0'

    // JGit and the Anthropic SDK both log through SLF4J. Without a binding
    // they print a startup warning to stderr on every run; the no-op binding
    // keeps the CLI output clean. Pinned to 2.x to match the slf4j-api the
    // Anthropic SDK brings in - a 1.7.x binding is ignored by a 2.x api and
    // the warning comes back, louder.
    runtimeOnly 'org.slf4j:slf4j-nop:2.0.16'

    // WireMock over a hand-rolled HttpServer for the GitHub client: these
    // tests are about request/response *sequences* - a 200 carrying an ETag
    // followed by a conditional request that must come back 304 - and about
    // asserting what was sent, not just what came back.
    testImplementation 'org.wiremock:wiremock:3.9.1'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    // Pins the JDK for every build, so the version does not depend on
    // whatever JAVA_HOME happens to be set to on this machine or on CI.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'dev.gitdigest.GitDigest'
}

/*
 * The version lives in exactly one place: the `version` property above.
 *
 * It used to be written out three times - here, in the @Command annotation,
 * and in the line the bare command prints - which is a promise that someone
 * will eventually tag a release whose binary reports the previous version.
 * Generating it into a resource means `gitdigest --version` cannot disagree
 * with the build that produced it.
 */
def generateVersionResource = tasks.register('generateVersionResource') {
    def outputDirectory = layout.buildDirectory.dir('generated/resources/version')
    def buildVersion = providers.provider { project.version.toString() }
    inputs.property('version', buildVersion)
    outputs.dir(outputDirectory)
    doLast {
        def file = outputDirectory.get().file('dev/gitdigest/version.properties').asFile
        file.parentFile.mkdirs()
        file.text = "version=" + buildVersion.get() + System.lineSeparator()
    }
}

sourceSets.main.resources.srcDir(generateVersionResource)

tasks.named('shadowJar') {
    // No classifier, so the artifact attached to a release is plainly the
    // thing you run: gitdigest-1.0.0.jar, not gitdigest-1.0.0-all.jar.
    archiveClassifier.set('')
    archiveBaseName.set('gitdigest')
    // ...which means it would otherwise be written to exactly the path the
    // ordinary jar occupies, and every task that reads build/libs - the start
    // scripts, the distributions - would start consuming it without declaring
    // that it does. Gradle 9 fails the build over that rather than guessing an
    // order, and it is right to. A separate directory keeps the clean file
    // name without the collision.
    destinationDirectory.set(layout.buildDirectory.dir('dist'))
    // Signature files from signed dependencies do not survive being merged
    // into a new jar, and a JVM refuses to load classes whose signatures no
    // longer match.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    manifest {
        attributes(
                'Implementation-Title': 'gitdigest',
                'Implementation-Version': project.version)
    }
}

// So `build` produces the runnable artifact rather than only the thin jar.
tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    // Gradle does not forward -D to the test JVM, so the golden-file update
    // switch would silently do nothing without this.
    systemProperty 'golden.update', System.getProperty('golden.update') ?: 'false'

    useJUnitPlatform {
        // The benchmark is a report, not a check: it is slow by design and its
        // result is a number rather than a pass. Keeping it out of `test` keeps
        // the build fast and keeps a loaded CI machine from failing it.
        excludeTags 'benchmark'
    }
}

tasks.register('benchmark', Test) {
    description = 'Measures parallel GitHub enrichment against a slow local server.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'benchmark'
    }
    // Always rerun: a cached timing measurement is not a measurement.
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
}
