name: release

on:
  push:
    tags: ['v*']

permissions:
  # Needed to create the release and attach the jar to it. Nothing else here
  # writes anything, so nothing else is granted.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, because the release notes are generated from it.
          # A shallow clone would produce notes covering the last commit only.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        # A tag is not a reason to skip the tests. It is the reason to run them.
        run: ./gradlew build --no-daemon

      - name: Check the version in the tag matches the version in the build
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(java -jar build/dist/gitdigest-*.jar --version | awk '{print $2}')
          if [ "$tag" != "$built" ]; then
            echo "Tag says $tag, the binary says $built."
            echo "Update 'version' in build.gradle to match the tag, or tag the version you built."
            exit 1
          fi
          echo "Releasing $built"

      - name: Write the release notes with gitdigest
        # The tool writes the notes for its own releases. Offline, because a
        # release must not depend on an API key or on the model being up -
        # which is the whole argument for having built the fallback.
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          jar=$(ls build/dist/gitdigest-*.jar)
          if [ -n "$previous" ]; then
            echo "Notes for $previous..${GITHUB_REF_NAME}"
            java -jar "$jar" notes . --from "$previous" --to "${GITHUB_REF_NAME}" --offline > NOTES.md
          else
            echo "First release; notes cover the whole history"
            java -jar "$jar" notes . --to "${GITHUB_REF_NAME}" --offline > NOTES.md
          fi
          printf '\n---\n\nGenerated by gitdigest itself. Requires Java 25.\n' >> NOTES.md
          cat NOTES.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          files: build/dist/gitdigest-*.jar
          fail_on_unmatched_files: true
