name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
# Cancelling it frees a runner instead of paying for a result nobody reads.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Both, deliberately. The tool is developed on Windows and most people who
    # install it will be on Linux, and the differences that bite are exactly
    # the ones this project has already been bitten by: line endings, the
    # default charset of a redirected stdout, and file locking while a temp
    # directory full of git repositories is deleted.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The tests script their own repositories, but the project's own
          # history is what `gitdigest notes` reads during a release, and a
          # shallow clone would hand it a truncated one.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Check the fat jar actually runs
        # `build` producing a jar is not the same claim as the jar working.
        # This is the artifact users download, so it gets executed here rather
        # than discovered to be broken after a release.
        shell: bash
        run: |
          jar=$(ls build/dist/gitdigest-*.jar)
          java -jar "$jar" --version
          java -jar "$jar" stats . --format json > /dev/null

      - name: Upload test results
        # Always, because a failed run is when they are worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: build/reports/tests/test/
          retention-days: 7
